<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "style.css" />
        <title>Gallery</title>
    </head>
    <body>
        <div class="slider-wrapper">
            <div class="slider-container">
                <button class="slider-btn" id="prevBtn">Назад</button>
                <div class="slider-viewport">
                    <div class="slider-track" id="sliderTrack">
                        <img class = "slider-img" src ="images/1.jpg" alt="1" />
                        <img class = "slider-img" src ="images/2.jpg" alt="2" />
                        <img class = "slider-img" src ="images/3.jpg" alt="3" />
                        <img class = "slider-img" src ="images/4.jpg" alt="4" />
                        <img class = "slider-img" src ="images/5.jpg" alt="5" />
                        <img class = "slider-img" src ="images/6.jpg" alt="6" />
                        <img class = "slider-img" src ="images/7.jpg" alt="7" />
                        <img class = "slider-img" src ="images/8.jpg" alt="8" />
                    </div>
                </div>
                <button class="slider-btn" id="nextBtn">Вперёд</button>
            </div>
            <div class="slider-pager" id="galleryPager"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
